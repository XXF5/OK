name: Bot Cycle (Repo B - 4h ON / 4h OFF)

on:
  schedule:
    - cron: "0 * * * *"   # كل ساعة
  workflow_dispatch:

concurrency:
  group: bot-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    steps:
      # ======================================
      # HARD STOP — منع التشغيل من الأساس
      # ======================================
      - name: HARD STOP if not work hour (UTC)
        run: |
          echo "UTC now:"
          date -u

          HOUR=$(date -u +%H)
          WORK_HOURS="5 6 7 8 13 14 15 16 21 22 23 0"

          if [[ ! " $WORK_HOURS " =~ " $HOUR " ]]; then
            echo "⛔ Not work hour — exiting job"
            exit 78
          fi

          echo "✅ Allowed work hour — starting bot"

      # ======================================
      # Checkout repos
      # ======================================
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: XXB4/RX
          token: ${{ secrets.GH_TOKEN }}
          path: private

      # ======================================
      # Docker setup
      # ======================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================
      # Build image (cached)
      # ======================================
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./private
          tags: telegram-bot:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======================================
      # Run bot with SMART AUTO-KILL
      # ======================================
      - name: Run bot (smart kill)
        run: |
          docker run --rm telegram-bot bash -c '
          WORK_HOURS="5 6 7 8 13 14 15 16 21 22 23 0"
          END=$((SECONDS+14400))  # 4 hours max

          echo "🚀 Bot started"

          while [ $SECONDS -lt $END ]; do
            HOUR=$(date -u +%H)

            if [[ " $WORK_HOURS " =~ " $HOUR " ]]; then
              echo "🟢 Hour $HOUR allowed — running"
              python main.py
            else
              echo "⛔ Hour $HOUR خارج وقت الشغل — killing bot"
              exit 0
            fi

            sleep 60
          done

          echo "⏱️ Max runtime reached — stopping bot"
          '
