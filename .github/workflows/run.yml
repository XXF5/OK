name: Bot Cycle (Egypt Time)

on:
  schedule:
    # الجدول الزمني يبقى بتوقيت UTC (كل ساعة)
    # لكن الفلترة في الخطوات بالأسفل ستكون بتوقيت مصر
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: bot-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    steps:
      # ======================================
      # 1. فحص الوقت بتوقيت مصر
      # ======================================
      - name: HARD STOP if not work hour (Egypt Time)
        run: |
          # ضبط المنطقة الزمنية لمصر
          export TZ="Africa/Cairo"
          
          echo "🇪🇬 Egypt Time now:"
          date

          # استخراج الساعة بصيغة 00-23
          HOUR=$(date +%H)
          
          # الساعات المسموحة (بصيغة خانتين 05 وليس 5)
          # الأوقات: 5-8 صباحاً، 1-4 ظهراً، 9-11 مساءً، ومنتصف الليل
          WORK_HOURS="05 06 07 08 13 14 15 16 21 22 23 00"

          if [[ ! " $WORK_HOURS " =~ " $HOUR " ]]; then
            echo "⛔ الساعة الآن ($HOUR) بتوقيت مصر - خارج أوقات العمل. إيقاف الـ Job."
            exit 78
          fi

          echo "✅ الساعة الآن ($HOUR) بتوقيت مصر - مسموح بالعمل."

      # ======================================
      # 2. Checkout
      # ======================================
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: XXB4/RX
          token: ${{ secrets.GH_TOKEN }}
          path: private

      # ======================================
      # 3. Docker Setup & Build
      # ======================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./private
          tags: telegram-bot:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======================================
      # 4. Run bot with Egypt Time Monitoring
      # ======================================
      - name: Run bot (Egypt Time Smart Kill)
        run: |
          # تمرير توقيت مصر للكونتير
          docker run --rm -e TZ=Africa/Cairo telegram-bot bash -c '
          
          # تعريف الساعات المسموحة داخل الكونتير أيضاً
          WORK_HOURS=" 05 06 07 08 13 14 15 16 21 22 23 00 "
          
          echo "🚀 Starting Python Bot in background (Egypt Time)..."
          
          # تشغيل البوت في الخلفية عشان نقدر نراقب الوقت
          python main.py &
          BOT_PID=$!
          
          # مدة التشغيل القصوى (4 ساعات)
          END=$((SECONDS+14400))

          while [ $SECONDS -lt $END ]; do
            # انتظار دقيقة قبل الفحص التالي
            sleep 60
            
            # 1. التأكد أن البوت لم ينهار (Crash check)
            if ! kill -0 $BOT_PID 2>/dev/null; then
                echo "⚠️ Bot stopped unexpectedly!"
                exit 1
            fi

            # 2. فحص الوقت الحالي بتوقيت مصر
            CURRENT_HOUR=$(date +%H)
            
            # هل الساعة الحالية موجودة في القائمة؟
            if [[ ! "$WORK_HOURS" =~ " $CURRENT_HOUR " ]]; then
              echo "⛔ الساعة $CURRENT_HOUR (مصر) - انتهى وقت العمل. جارٍ إيقاف البوت..."
              kill $BOT_PID
              exit 0
            else
              # طباعة للتأكيد فقط (اختياري)
              # echo "✅ الساعة $CURRENT_HOUR (مصر) - مستمر..."
              :
            fi
          done

          echo "⏱️ Max runtime reached (4 hours) — stopping bot"
          kill $BOT_PID
          '
