
name: Bot Cycle (4h ON / 2h OFF)

on:
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: XXB4/RX
          token: ${{ secrets.GH_TOKEN }}
          path: private

      - name: Build Docker image
        run: docker build -t telegram-bot ./private

      - name: Run bot for 4 hours
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS=true \
            telegram-bot \
            timeout 14400 python main.py

      - name: Sleep 2 hours
        run: sleep 7200

      - name: Restart workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches \
            -d '{"ref":"main"}'
