version: 2.1

workflows:
  bot_cycle:
    triggers:
      - schedule:
          cron: "0 * * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - cycle

jobs:
  cycle:
    docker:
      - image: cimg/base:stable
    resource_class: medium

    steps:
      # ======================================
      # 1. فحص الوقت (توقيت مصر)
      # ======================================
      - run:
          name: HARD STOP if not work hour (Egypt Time)
          command: |
            export TZ="Africa/Cairo"
            date

            HOUR=$(date +%H)
            WORK_HOURS="01 02 03 04 09 10 11 12 17 18 19 20"

            if [[ ! " $WORK_HOURS " =~ " $HOUR " ]]; then
              echo "⛔ خارج الوقت المسموح"
              circleci step halt
            fi

            echo "✅ داخل الوقت المسموح"

      # ======================================
      # 2. Checkout
      # ======================================
      - checkout

      - run:
          name: Checkout private repo
          command: |
            git clone https://${GH_TOKEN}@github.com/XXB4/RX.git private

      # ======================================
      # 3. Docker
      # ======================================
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image
          command: |
            docker build -t telegram-bot:latest ./private

      # ======================================
      # 4. Run bot (4h max)
      # ======================================
      - run:
          name: Run bot
          command: |
            docker run --rm -e TZ=Africa/Cairo telegram-bot bash -c '
              WORK_HOURS=" 01 02 03 04 09 10 11 12 17 18 19 20 "
              python main.py &
              BOT_PID=$!
              END=$((SECONDS+14400))

              while [ $SECONDS -lt $END ]; do
                sleep 60
                CURRENT_HOUR=$(date +%H)
                if [[ ! "$WORK_HOURS" =~ " $CURRENT_HOUR " ]]; then
                  kill $BOT_PID
                  exit 0
                fi
              done

              kill $BOT_PID
            '
