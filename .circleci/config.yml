version: 2.1

workflows:
  bot_cycle:
    triggers:
      - schedule:
          cron: "0 * * * *"   # كل ساعة
          filters:
            branches:
              only:
                - main
    jobs:
      - cycle

jobs:
  cycle:
    docker:
      - image: cimg/base:stable
    resource_class: medium

    steps:
      # ======================================
      # 1. HARD STOP — فحص الوقت (توقيت مصر)
      # ======================================
      - run:
          name: HARD STOP if not work hour (Egypt Time)
          command: |
            export TZ="Africa/Cairo"

            echo "🇪🇬 Egypt Time now:"
            date

            HOUR=$(date +%H)

            # الساعات المسموحة (المعكوسة)
            WORK_HOURS="01 02 03 04 09 10 11 12 17 18 19 20"

            if [[ ! " $WORK_HOURS " =~ " $HOUR " ]]; then
              echo "⛔ الساعة ($HOUR) خارج الوقت المسموح — إيقاف الـ Job"
              circleci step halt
            fi

            echo "✅ الساعة ($HOUR) داخل الوقت المسموح — المتابعة"

      # ======================================
      # 2. Checkout
      # ======================================
      - checkout

      - run:
          name: Checkout private repo
          command: |
            git clone https://${GH_TOKEN}@github.com/XXB4/RX.git private

      # ======================================
      # 3. Docker Setup & Build
      # ======================================
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image
          command: |
            docker build -t telegram-bot:latest ./private

      # ======================================
      # 4. Run bot (Egypt Time Smart Kill)
      # ======================================
      - run:
          name: Run bot (4h max + Egypt Time check)
          command: |
            docker run --rm -e TZ=Africa/Cairo telegram-bot bash -c '
              WORK_HOURS=" 01 02 03 04 09 10 11 12 17 18 19 20 "

              echo "🚀 Starting bot..."
              python main.py &
              BOT_PID=$!

              END=$((SECONDS+14400))  # 4 ساعات

              while [ $SECONDS -lt $END ]; do
                sleep 60

                # لو البوت وقع
                if ! kill -0 $BOT_PID 2>/dev/null; then
                  echo "⚠️ Bot stopped unexpectedly"
                  exit 1
                fi

                CURRENT_HOUR=$(date +%H)

                # لو خرجنا من الساعات المسموحة
                if [[ ! "$WORK_HOURS" =~ " $CURRENT_HOUR " ]]; then
                  echo "⛔ خارج الوقت المسموح — إيقاف البوت"
                  kill $BOT_PID
                  exit 0
                fi
              done

              echo "⏱️ انتهت 4 ساعات — إيقاف البوت"
              kill $BOT_PID
            '
