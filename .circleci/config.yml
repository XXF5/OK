version: 2.1

orbs:
  docker: circleci/docker@2.6.0

workflows:
  bot_cycle:
    triggers:
      - schedule:
          cron: "0 * * * *"   # كل ساعة
          filters:
            branches:
              only:
                - main
    jobs:
      - cycle

jobs:
  cycle:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    timeout: 260m

    steps:
      # ======================================
      # 1. فحص الوقت (توقيت مصر) - الساعات المعكوسة
      # ======================================
      - run:
          name: HARD STOP if not work hour (Egypt Time)
          command: |
            export TZ="Africa/Cairo"

            echo "🇪🇬 Egypt Time now:"
            date

            HOUR=$(date +%H)

            # الساعات المسموحة
            WORK_HOURS="01 02 03 04 09 10 11 12 17 18 19 20"

            if [[ ! " $WORK_HOURS " =~ " $HOUR " ]]; then
              echo "⛔ الساعة الآن ($HOUR) بتوقيت مصر - خارج الجدول. إيقاف الـ Job."
              circleci step halt
            fi

            echo "✅ الساعة الآن ($HOUR) بتوقيت مصر - مسموح بالعمل."

      # ======================================
      # 2. Checkout
      # ======================================
      - checkout

      - run:
          name: Checkout private repo
          command: |
            git clone https://${GH_TOKEN}@github.com/XXB4/RX.git private

      # ======================================
      # 3. Docker Setup & Build
      # ======================================
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image
          command: |
            docker build -t telegram-bot:latest ./private

      # ======================================
      # 4. Run bot (Egypt Time Smart Kill)
      # ======================================
      - run:
          name: Run bot (Egypt Time Smart Kill)
          command: |
            docker run --rm -e TZ=Africa/Cairo telegram-bot bash -c '
            
            WORK_HOURS=" 01 02 03 04 09 10 11 12 17 18 19 20 "
            
            echo "🚀 Starting Python Bot in background (Egypt Time)..."
            
            python main.py &
            BOT_PID=$!
            
            END=$((SECONDS+14400))  # 4 ساعات

            while [ $SECONDS -lt $END ]; do
              sleep 60

              if ! kill -0 $BOT_PID 2>/dev/null; then
                echo "⚠️ Bot process died unexpectedly!"
                exit 1
              fi

              CURRENT_HOUR=$(date +%H)

              if [[ ! "$WORK_HOURS" =~ " $CURRENT_HOUR " ]]; then
                echo "⛔ الساعة $CURRENT_HOUR (مصر) - انتهى الوقت المسموح. إيقاف البوت..."
                kill $BOT_PID
                exit 0
              fi
            done

            echo "⏱️ Max runtime reached (4 hours) — stopping bot"
            kill $BOT_PID
            '